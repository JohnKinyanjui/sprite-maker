name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run svelte-check
        run: bun run check

  rust-lib:
    name: Rust lib tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download bundled ffmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Run lib test suite
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  rust-pipeline-e2e:
    name: Rust pipeline E2E (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download bundled ffmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Run pipeline E2E and fixture regression
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml -- pipeline_e2e fixture_regression

  rust-pipeline-e2e-macos:
    name: Rust pipeline E2E (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download bundled ffmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Run pipeline E2E and fixture regression
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml -- pipeline_e2e fixture_regression
