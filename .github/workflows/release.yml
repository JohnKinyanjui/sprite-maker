name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify frontend
        run: bun run check

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sprite Studio v__VERSION__
          releaseBody: |
            Sprite Studio v__VERSION__ is a major workflow update for creating production-ready 2D game art locally.

            Highlights include anatomy-aware rigging, deterministic frame rendering, optional regional AI polish, physical motion planning, seamless loop validation, complete terrain atlases, coordinated asset packs, chat-scoped image references, Markdown previews, concurrent chat generation, a zoomable sprite viewer, and per-chat generation controls with interpolation enabled by default.

            Download the installer for your platform below. Native builds are provided for Windows, Linux, Apple Silicon Macs, and Intel Macs. See the repository changelog for the complete update notes.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
