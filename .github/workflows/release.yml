name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify frontend
        run: bun run check

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sprite Studio v__VERSION__
          releaseBody: |
            Sprite Studio v__VERSION__ makes coordinated asset packs scalable, easy to inspect, and ready for animation.

            Pack requests now honor explicit item counts beyond 12 by generating consistent batches under one pack manifest. Completed packs stay in chat as one grouped component instead of redirecting to another tab or appearing as animation frames.

            **View sprites** opens a dedicated searchable grid. Every item can be inspected with pixel-accurate zoom, downloaded individually, or carried into chat as the exact source for a new animation. This release also fixes concurrent pack-message recovery and prevents weapon names such as `battle_axe` from receiving flying motion suggestions.

            Download the installer for your platform below. Native builds are provided for Windows, Linux, Apple Silicon Macs, and Intel Macs. See CHANGELOG.md for complete details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
